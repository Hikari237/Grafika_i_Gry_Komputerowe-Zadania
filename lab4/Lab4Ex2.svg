

<svg version="1.1" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800px" height="400px" viewBox="0 0 800 400">

  
    <rect width="100%" height="100%" fill="#12094F"/>

    <circle cy="80" r="3" fill="white">
        <animate attributeName="cx" values="800; -20" dur="2s" repeatCount="indefinite" />
        <animate attributeName="r" values="3; 1; 3" dur="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cy="320" r="4" fill="white">
        <animate attributeName="cx" values="800; -20" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
        <animate attributeName="r" values="4; 1; 4" dur="0.7s" repeatCount="indefinite" />
    </circle>
    <circle cy="200" r="2" fill="white">
        <animate attributeName="cx" values="800; -20" dur="3s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cy="120" r="3" fill="white">
        <animate attributeName="cx" values="800; -20" dur="2.5s" begin="0.8s" repeatCount="indefinite" />
        <animate attributeName="r" values="3; 1; 3" dur="0.6s" repeatCount="indefinite" />
    </circle>

   
    <defs>
        <g id="rainbow-col">
            <rect y="150" width="42" height="15" fill="#ff0000"/>
            <rect y="165" width="42" height="15" fill="#ff9900"/>
            <rect y="180" width="42" height="15" fill="#ffff00"/>
            <rect y="195" width="42" height="15" fill="#33ff00"/>
            <rect y="210" width="42" height="15" fill="#0099ff"/>
            <rect y="225" width="42" height="15" fill="#6633ff"/>
        </g>
    </defs>

    <g id="tecza">
       
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="0,10; 0,0; 0,10" dur="0.4s" repeatCount="indefinite"/>
        </use>
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="40,0; 40,10; 40,0" dur="0.4s" repeatCount="indefinite"/>
        </use>
        
       
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="80,10; 80,0; 80,10" dur="0.4s" repeatCount="indefinite"/>
        </use>
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="120,0; 120,10; 120,0" dur="0.4s" repeatCount="indefinite"/>
        </use>
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="160,10; 160,0; 160,10" dur="0.4s" repeatCount="indefinite"/>
        </use>
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="200,0; 200,10; 200,0" dur="0.4s" repeatCount="indefinite"/>
        </use>
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="240,10; 240,0; 240,10" dur="0.4s" repeatCount="indefinite"/>
        </use>
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="280,0; 280,10; 280,0" dur="0.4s" repeatCount="indefinite"/>
        </use>
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="320,10; 320,0; 320,10" dur="0.4s" repeatCount="indefinite"/>
        </use>
        <use xlink:href="#rainbow-col">
            <animateTransform attributeName="transform" type="translate" values="360,0; 360,10; 360,0" dur="0.4s" repeatCount="indefinite"/>
        </use>
    </g>

    
    <g>
      
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="0.4s" repeatCount="indefinite" />

        
        <path d="M 380 195 L 350 180 L 355 170 L 380 185 Z" fill="#999999" stroke="black" stroke-width="4" stroke-linejoin="round"/>
        
        
        <rect x="390" y="200" width="12" height="32" rx="4" fill="#999999" stroke="black" stroke-width="4">
            <animate attributeName="y" values="200; 195; 200" dur="0.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="410" y="200" width="12" height="32" rx="4" fill="#999999" stroke="black" stroke-width="4">
            <animate attributeName="y" values="195; 200; 195" dur="0.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="440" y="200" width="12" height="32" rx="4" fill="#999999" stroke="black" stroke-width="4">
            <animate attributeName="y" values="200; 195; 200" dur="0.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="460" y="200" width="12" height="32" rx="4" fill="#999999" stroke="black" stroke-width="4">
            <animate attributeName="y" values="195; 200; 195" dur="0.2s" repeatCount="indefinite"/>
        </rect>

    
        <rect x="380" y="160" width="80" height="60" rx="4" fill="#f4d0a4" stroke="black" stroke-width="4"/>
        
      
        <rect x="385" y="165" width="70" height="50" rx="2" fill="#ffb3ba"/>
        <rect x="395" y="170" width="6" height="6" fill="#e65a7d"/>
        <rect x="440" y="175" width="6" height="6" fill="#e65a7d"/>
        <rect x="410" y="200" width="6" height="6" fill="#e65a7d"/>
        <rect x="435" y="195" width="6" height="6" fill="#e65a7d"/>
        <rect x="395" y="195" width="6" height="6" fill="#e65a7d"/>


        <path d="M 440 185
                 L 445 160
                 L 455 175
                 L 470 175
                 L 480 160
                 L 485 185
                 L 485 210
                 L 440 210
                 Z" fill="#999999" stroke="black" stroke-width="4" stroke-linejoin="round"/>
                 
        
        <circle cx="455" cy="185" r="4" fill="black"/>
        <circle cx="475" cy="185" r="4" fill="black"/>
        <circle cx="453" cy="183" r="1.5" fill="white"/>
        <circle cx="473" cy="183" r="1.5" fill="white"/>

        <circle cx="445" cy="195" r="5" fill="#ff9999"/>
        <circle cx="485" cy="195" r="5" fill="#ff9999"/>
    
        <path d="M 460 192 L 465 197 L 470 192" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
       
  
 
    </g>
</svg>


