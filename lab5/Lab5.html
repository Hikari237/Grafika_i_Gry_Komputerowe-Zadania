<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Grafika 3D - Port do WebGL (Three.js)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1f; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; }
        .controls { position: absolute; top: 40px; left: 10px; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; pointer-events: none; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="info"><h2>Grafika 3D - WebGL</h2></div>
    <div class="controls">
        <b>Sterowanie:</b><br><br>
        [ 1 ] - Korkociąg<br>
        [ 2 ] - Piramida (N=13)<br>
        [ C ] - Zmień kolor korkociągu<br><br>
        Strzałki GÓRA / DÓŁ - Obrót X<br>
        Strzałki LEWO / PRAWO - Obrót Y<br>
        Page Up / Page Down - Obrót Z<br>
        Home - Reset obrotu
    </div>

    <script type="module">
        import * as THREE from 'three';

        let objectNumber = 1;
        let colorIndex = 0;
        const N = 13;
        
        let rotX = 15.0;
        let rotY = 0.0;
        let rotZ = 0.0;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0.1, 0.1, 0.12);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50.0);
        camera.position.set(0.0, 1.0, 4.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const turns = 13;
        const pointsPerTurn = 60;
        const corkscrewCount = turns * pointsPerTurn;
        const r = 0.6;

        const positions = [];
        const sizes = [];

        for (let i = 0; i < corkscrewCount; i++) {
            const angle = i * 0.15;
            const y = (i / corkscrewCount) * 2.0 - 1.0;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const pointSize = 2.0 + (i / corkscrewCount) * 15.0;

            positions.push(x, y, z);
            sizes.push(pointSize);
        }

        const corkscrewGeometry = new THREE.BufferGeometry();
        corkscrewGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        corkscrewGeometry.setAttribute('aPS', new THREE.Float32BufferAttribute(sizes, 1));

        const corkscrewColors = [
            new THREE.Vector3(0.0, 1.0, 0.0),
            new THREE.Vector3(0.0, 0.0, 1.0),
            new THREE.Vector3(0.6, 0.3, 0.1)
        ];

        const vertexShader = `
            attribute float aPS;
            void main() {
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                gl_PointSize = aPS;
            }
        `;

        const fragmentShader = `
            uniform vec3 uColor;
            void main() {
                vec2 c = gl_PointCoord - vec2(0.5);
                if (dot(c, c) > 0.25) discard; 
                gl_FragColor = vec4(uColor, 1.0);
            }
        `;

        const corkscrewMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: corkscrewColors[0] }
            },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true
        });

        const corkscrew = new THREE.Points(corkscrewGeometry, corkscrewMaterial);
        mainGroup.add(corkscrew);

        const pyramidPositions = [];
        const pyramidColors = [];

        const basePts = [];
        for (let i = 0; i <= N; i++) {
            const angle = i * 2.0 * Math.PI / N;
            basePts.push(new THREE.Vector3(Math.cos(angle) * 0.8, -0.5, Math.sin(angle) * 0.8));
        }

        const apex = new THREE.Vector3(0.0, 0.8, 0.0);
        const center = new THREE.Vector3(0.0, -0.5, 0.0);

        const colorBase = new THREE.Color(0.5, 0.5, 0.5);
        const colorEven = new THREE.Color(0.8, 0.3, 0.3);
        const colorOdd = new THREE.Color(0.6, 0.1, 0.1);

        for (let i = 0; i < N; i++) {
            pyramidPositions.push(center.x, center.y, center.z);
            pyramidPositions.push(basePts[i+1].x, basePts[i+1].y, basePts[i+1].z);
            pyramidPositions.push(basePts[i].x, basePts[i].y, basePts[i].z);
            
            pyramidColors.push(colorBase.r, colorBase.g, colorBase.b);
            pyramidColors.push(colorBase.r, colorBase.g, colorBase.b);
            pyramidColors.push(colorBase.r, colorBase.g, colorBase.b);

            pyramidPositions.push(apex.x, apex.y, apex.z);
            pyramidPositions.push(basePts[i].x, basePts[i].y, basePts[i].z);
            pyramidPositions.push(basePts[i+1].x, basePts[i+1].y, basePts[i+1].z);

            const col = (i % 2 === 0) ? colorEven : colorOdd;
            pyramidColors.push(col.r, col.g, col.b);
            pyramidColors.push(col.r, col.g, col.b);
            pyramidColors.push(col.r, col.g, col.b);
        }

        const pyramidGeometry = new THREE.BufferGeometry();
        pyramidGeometry.setAttribute('position', new THREE.Float32BufferAttribute(pyramidPositions, 3));
        pyramidGeometry.setAttribute('color', new THREE.Float32BufferAttribute(pyramidColors, 3));

        const pyramidMaterial = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
        const pyramid = new THREE.Mesh(pyramidGeometry, pyramidMaterial);
        pyramid.visible = false;
        mainGroup.add(pyramid);

        window.addEventListener('keydown', (e) => {
            const step = 5.0;
            switch(e.key) {
                case '1':
                    objectNumber = 1;
                    corkscrew.visible = true;
                    pyramid.visible = false;
                    break;
                case '2':
                    objectNumber = 2;
                    corkscrew.visible = false;
                    pyramid.visible = true;
                    break;
                case 'c':
                case 'C':
                    colorIndex = (colorIndex + 1) % 3;
                    corkscrewMaterial.uniforms.uColor.value = corkscrewColors[colorIndex];
                    break;
                case 'ArrowUp':
                    rotX -= step;
                    break;
                case 'ArrowDown':
                    rotX += step;
                    break;
                case 'ArrowLeft':
                    rotY -= step;
                    break;
                case 'ArrowRight':
                    rotY += step;
                    break;
                case 'PageUp':
                    rotZ += step;
                    break;
                case 'PageDown':
                    rotZ -= step;
                    break;
                case 'Home':
                    rotX = 15.0;
                    rotY = 0.0;
                    rotZ = 0.0;
                    break;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            mainGroup.rotation.set(
                THREE.MathUtils.degToRad(rotX),
                THREE.MathUtils.degToRad(rotY),
                THREE.MathUtils.degToRad(rotZ),
                'XYZ'
            );

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
