<!DOCTYPE html>
<meta charset="UTF-8">
<html>
<head>
<title>WebGL Intro</title>
<style>
    html, body {
        margin: 0;  /* Make sure that there is no margin around the canvas */
        overflow: hidden;  /* Make sure we don't get scroll bars. */
    }
    canvas {
        display: block; /* The default display, inline, would add a small margin below the canvas */
    }
</style>

<!--
    A 2D WebGL app in which "points" move around in the browser window, bouncing
    off the edges. The animation can be paused and restarted by pressing the space key.
    
    INTERFEJS KLAWIATURY:
    - [Spacja] : Wstrzymuje i wznawia animację.
    - [C]      : Włącza / wyłącza losowe kolory (jeśli wyłączone, kwadraty są czerwone).
    - [0]      : Styl 0 - Zwykłe kwadraty (domyślny).
    - [1]      : Styl 1 - Dysk (odrzucanie pikseli powyżej odległości 0.5).
    - [2]      : Styl 2 - Rozmyty dysk (zanika od środka do krawędzi).
-->

<script type="x-shader/x-vertex" id="vshader-source">
    attribute vec2 a_coords; // vertex position in standard canvas pixel coords
    attribute vec3 a_color;   // Dodana zmienna atrybutu dla koloru (typ vec3)[cite: 3]
    
    uniform float u_width;   // width of canvas
    uniform float u_height;  // height of canvas
    uniform float u_pointSize; 
    
    varying vec3 v_color;    // Varying jest jedyną ścieżką przesyłu danych między vertex a fragment shaderem[cite: 4]
    
    void main() {
        float x,y;  // vertex position in clip coordinates
        
        x = a_coords.x/u_width * 2.0 - 1.0;  // convert pixel coords to clip coords
        y = 1.0 - a_coords.y/u_height * 2.0;
        
        gl_Position = vec4(x, y, 0.0, 1.0);
        gl_PointSize = u_pointSize;
        
        // Przekazanie koloru do shadera fragmentów
        v_color = a_color; 
    }
</script>

<script type="x-shader/x-fragment" id="fshader-source">
    #ifdef GL_FRAGMENT_PRECISION_HIGH
       precision highp float;
    #else
       precision mediump float;
    #endif
    
    varying vec3 v_color; // Odebranie koloru z vertex shadera[cite: 4]
    uniform int u_style;  // Jednolita zmienna typu int kontrolująca styl punktu[cite: 3]

    void main() {
        float dist = distance( vec2(0.5), gl_PointCoord ); // Obliczanie odległości od środka punktu[cite: 3]
        float alpha = 1.0; // Domyślna przezroczystość alfa

        // Styl 1: Koło/Dysk
        if (u_style == 1) {
            if (dist > 0.5) {
                discard; // Odrzucenie pikseli w celu stworzenia dysku[cite: 3]
            }
        } 
        // Styl 2: Zanikające koło
        else if (u_style == 2) {
            if (dist > 0.5) {
                discard;
            }
            // Punkt zanika z całkowicie nieprzezroczystego w środku do całkowicie przezroczystego na krawędzi[cite: 3]
            alpha = 1.0 - (dist * 2.0); 
        }

        gl_FragColor = vec4(v_color, alpha);
    }
</script>

<script>
"use strict";

var canvas; // The canvas that is used for WebGL drawing; occupies the entire window. 
var gl;     // The webgl context.

var u_width_loc;        
var u_height_loc;       
var u_pointSize_loc;    
var a_coords_loc;       

var a_coords_buffer;    

// NOWE ZMIENNE
var a_color_loc;            // Identyfikator atrybutu color[cite: 3]
var a_color_buffer;         // Bufor WebGL dla atrybutu koloru[cite: 3]
var u_style_loc;            // Lokalizacja zmiennej jednolitej określającej styl[cite: 3]

var POINT_COUNT = 30;   
var POINT_SIZE = 64;    

var positions = new Float32Array( 2*POINT_COUNT );  
var velocities = new Float32Array( 2*POINT_COUNT ); 
var colors = new Float32Array( 3*POINT_COUNT ); // Float32Array do przechowywania wartości kolorów[cite: 3]

var isRunning = true;  
var useRandomColors = true; // Zmienna stanu określająca, czy używamy losowych kolorów
var currentStyle = 0;       // Aktualny styl (0 - kwadrat, 1 - koło, 2 - rozmycie)

function render() {
    gl.clear(gl.COLOR_BUFFER_BIT);  

    // Ustawienie aktualnego stylu w shaderze[cite: 3]
    gl.uniform1i(u_style_loc, currentStyle);

    gl.bindBuffer(gl.ARRAY_BUFFER, a_coords_buffer);            
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STREAM_DRAW);  
    gl.vertexAttribPointer(a_coords_loc, 2, gl.FLOAT, false, 0, 0);  
    
    // Logika włączania i wyłączania losowych kolorów[cite: 3]
    if (useRandomColors) {
        gl.enableVertexAttribArray(a_color_loc); // Użyj bufora atrybutów kolorów[cite: 3]
        gl.bindBuffer(gl.ARRAY_BUFFER, a_color_buffer);
        gl.vertexAttribPointer(a_color_loc, 3, gl.FLOAT, false, 0, 0);
    } else {
        gl.disableVertexAttribArray(a_color_loc); // Nie używaj bufora atrybutów[cite: 3]
        gl.vertexAttrib3f(a_color_loc, 1, 0, 0);  // Ustaw kolor atrybutu na czerwony[cite: 3]
    }
    
    gl.drawArrays(gl.POINTS, 0, POINT_COUNT);
    
    if (gl.getError() != gl.NO_ERROR) {
        console.log("During render, a GL error has been detected.");
    }
} 

function createData() {
    for (var i = 0; i < POINT_COUNT; i++) {
        positions[2*i] = canvas.width/2;
        positions[2*i+1] = canvas.height/2;
        var speed = 2 + 4*Math.random();
        var angle = 2*Math.PI*Math.random();
        velocities[2*i] = speed*Math.sin(angle);
        velocities[2*i+1] = speed*Math.cos(angle);
        
        // Generowanie losowych wartości w zakresie od 0,0 do 1,0 dla składników koloru[cite: 3]
        colors[3*i] = Math.random();     // R
        colors[3*i+1] = Math.random();   // G
        colors[3*i+2] = Math.random();   // B
    }
} 

function updateData() {
    for (var i = 0; i < POINT_COUNT; i++) {
       positions[2*i] += velocities[2*i];
       if ( positions[2*i] < POINT_SIZE/2 && velocities[2*i] < 0) {
           positions[2*i] += 2*(POINT_SIZE/2 - positions[2*i]);
           velocities[2*i] = Math.abs(velocities[2*i]);
       }
       else if (positions[2*i] > canvas.width - POINT_SIZE/2 && velocities[2*i] > 0){
           positions[2*i] -= 2*(positions[2*i] - canvas.width + POINT_SIZE/2);
           velocities[2*i] = - Math.abs(velocities[2*i]);
       }
       positions[2*i+1] += velocities[2*i+1];
       if ( positions[2*i+1] < POINT_SIZE/2  && velocities[2*i+1] < 0) {
           positions[2*i+1] += 2*(POINT_SIZE/2 - positions[2*i+1]);
           velocities[2*i+1] = Math.abs(velocities[2*i+1]);
       }
       else if (positions[2*i+1] > canvas.height - POINT_SIZE/2  && velocities[2*i+1] > 0){
           positions[2*i+1] -= 2*(positions[2*i+1] - canvas.height + POINT_SIZE/2);
           velocities[2*i+1] = - Math.abs(velocities[2*i+1]);
       }
    }
} 

/* Called when the user hits a key */
function doKey(evt) {
    var key = evt.keyCode;
    console.log("key pressed with keycode = " + key);
    
    if (key == 32) {  // space bar
        if (isRunning) {
            isRunning = false;  // stops the animation
        }
        else {
            isRunning = true;
           requestAnimationFrame(frame);  // restart the animation
        }
    }
    // Włączanie/wyłączanie kolorów przyciskiem 'C' (kod 67)[cite: 3]
    else if (key == 67) { 
        useRandomColors = !useRandomColors;
        if (!isRunning) render();
    }
    // Wybór stylów za pomocą klawiszy numerycznych (0, 1, 2)[cite: 3]
    else if (key == 48) { // Klawisz '0'
        currentStyle = 0;
        if (!isRunning) render();
    }
    else if (key == 49) { // Klawisz '1'
        currentStyle = 1;
        if (!isRunning) render();
    }
    else if (key == 50) { // Klawisz '2'
        currentStyle = 2;
        if (!isRunning) render();
    }
}

/* Initialize the WebGL context.  Called from init() */
function initGL() {
    var prog = createProgram(gl,"vshader-source", "fshader-source", "a_coords");
    gl.useProgram(prog);
    
    /* Get locations of uniforms and attributes. */
    u_width_loc = gl.getUniformLocation(prog,"u_width");
    u_height_loc = gl.getUniformLocation(prog,"u_height");
    u_pointSize_loc = gl.getUniformLocation(prog,"u_pointSize");
    a_coords_loc = gl.getAttribLocation(prog,"a_coords");
    
    // Zlokalizowanie nowych zmiennych
    a_color_loc = gl.getAttribLocation(prog, "a_color");
    u_style_loc = gl.getUniformLocation(prog, "u_style");
    
    /* Assign initial values to uniforms. */    
    gl.uniform1f(u_width_loc, canvas.width);
    gl.uniform1f(u_height_loc, canvas.height);
    gl.uniform1f(u_pointSize_loc, POINT_SIZE);
    
    /* Create and configure buffers for the attributes. */
    a_coords_buffer = gl.createBuffer();
    gl.enableVertexAttribArray(a_coords_loc); 
    
    // Utworzenie bufora i wypełnienie go danymi o kolorach[cite: 3]
    // Można to zrobić w initGL(), ponieważ wartości kolorów nie zmienią się po ich utworzeniu[cite: 3]
    a_color_buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, a_color_buffer);
    gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
    
    /* Configure other WebGL options. */
    gl.clearColor(0,0,0,1);  
    
    // Ustawienia dla przezroczystości alfa[cite: 3]
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    
    if (gl.getError() != gl.NO_ERROR) {
        console.log("During initialization, a GL error has been detected.");
    }
} 

function createProgram(gl, vertexShaderID, fragmentShaderID, attribute0) {
    function getTextContent( elementID ) {
        var element = document.getElementById(elementID);
        var node = element.firstChild;
        var str = "";
        while (node) {
            if (node.nodeType == 3) str += node.textContent;
            node = node.nextSibling;
        }
        return str;
    }
    try {
        var vertexShaderSource = getTextContent( vertexShaderID );
        var fragmentShaderSource = getTextContent( fragmentShaderID );
    }
    catch (e) {
        throw "Error: Could not get shader source code from script elements.";
    }
    var vsh = gl.createShader( gl.VERTEX_SHADER );
    gl.shaderSource(vsh,vertexShaderSource);
    gl.compileShader(vsh);
    if ( ! gl.getShaderParameter(vsh, gl.COMPILE_STATUS) ) {
        throw "Error in vertex shader:  " + gl.getShaderInfoLog(vsh);
     }
    var fsh = gl.createShader( gl.FRAGMENT_SHADER );
    gl.shaderSource(fsh, fragmentShaderSource);
    gl.compileShader(fsh);
    if ( ! gl.getShaderParameter(fsh, gl.COMPILE_STATUS) ) {
       throw "Error in fragment shader:  " + gl.getShaderInfoLog(fsh);
    }
    var prog = gl.createProgram();
    gl.attachShader(prog,vsh);
    gl.attachShader(prog, fsh);
    if (attribute0) {
       gl.bindAttribLocation(prog,0,attribute0);
    }
    gl.linkProgram(prog);
    if ( ! gl.getProgramParameter( prog, gl.LINK_STATUS) ) {
       throw "Link error in program:  " + gl.getProgramInfoLog(prog);
    }
    return prog;
}

function frame() {
    if (isRunning) {
       updateData();
       render();
       requestAnimationFrame(frame);  
    }
}

 function doResize() {
     canvas.width = window.innerWidth;
     canvas.height = window.innerHeight;
     gl.viewport(0, 0, canvas.width, canvas.height);
     gl.uniform1f(u_width_loc, canvas.width);
     gl.uniform1f(u_height_loc, canvas.height);
     if (!isRunning) {
         render();
     }
 }

function doMouse(evt) {
    function headTowards(x,y) {
        for (var i = 0; i < POINT_COUNT; i++) {
            var dx = x - positions[2*i];
            var dy = y - positions[2*i+1];
            var dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 0.1) { 
                var speed = Math.sqrt( velocities[2*i]*velocities[2*i] + velocities[2*i+1]*velocities[2*i+1] );
                velocities[2*i] = dx/dist * speed;
                velocities[2*i+1] = dy/dist * speed;
            }
        }
    }
    function move(evt) {
        headTowards(evt.clientX,evt.clientY);
    }
    function up() {
        canvas.removeEventListener("mousemove", move, false);
        document.removeEventListener("mouseup", up, false);
    }
    if (evt.which != 1) {
        return;  
    }
    if (evt.shiftKey) {
        createData();
        return;
    }
    headTowards(evt.clientX,evt.clientY);
    canvas.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
}

function init() {
    try {
        canvas = document.createElement("canvas");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var options = { 
              alpha: false,   
              depth: false,   
              stencil: false  
           };
        gl = canvas.getContext("webgl", options);
        if ( ! gl ) {
            throw "Browser does not support WebGL";
        }
    }
    catch (e) {
        var message = document.createElement("p");
        message.innerHTML = "Sorry, could not get a WebGL graphics context.  Error: " + e;
        document.body.appendChild(message);
        return;
    }
    try {
        createData();  
        initGL();  
    }
    catch (e) {
        var message = document.createElement("p");
        message.innerHTML = 
            "<pre>Sorry, could not initialize graphics context.  Error:\n\n" + e + "</pre>";
        document.body.appendChild(message);
        return;
    }
    document.body.appendChild(canvas);
    window.addEventListener("resize", doResize);
    canvas.addEventListener("mousedown",doMouse);
    document.addEventListener("keydown",doKey);
    requestAnimationFrame(frame);
}

</script>
</head>
<body onload="init()">
<noscript>Sorry, this page requires JavaScript.</noscript>
</body>
</html>
