<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Lab 7 - Pionek, wariant 1</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1a1a1a; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 10);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

function setupLights(s) {
  s.add(new THREE.AmbientLight(0xffffff, 0.35));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(10, 20, 15);
  s.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.5);
  fill.position.set(-10, 5, -10);
  s.add(fill);
}

function buildPawn() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x1a1a1a);
  setupLights(s);

  const blackMaterial = new THREE.MeshStandardMaterial({
    color: 0x151515,
    roughness: 0.4,
    metalness: 0.1,
    side: THREE.DoubleSide
  });

  const points = [];
  points.push(new THREE.Vector2(0.0, 0.0)); 
  points.push(new THREE.Vector2(1.5, 0.0));
  points.push(new THREE.Vector2(1.5, 0.3));
  points.push(new THREE.Vector2(1.3, 0.5));
  points.push(new THREE.Vector2(1.2, 0.7));
  points.push(new THREE.Vector2(0.7, 1.5));
  points.push(new THREE.Vector2(0.5, 2.5));
  points.push(new THREE.Vector2(0.9, 2.7));
  points.push(new THREE.Vector2(0.9, 2.9));
  points.push(new THREE.Vector2(0.4, 3.0));
  points.push(new THREE.Vector2(0.8, 3.3));
  points.push(new THREE.Vector2(0.9, 3.7));
  points.push(new THREE.Vector2(0.7, 4.1));
  points.push(new THREE.Vector2(0.4, 4.4));
  points.push(new THREE.Vector2(0.0, 4.5));

  const pawnGeom = new THREE.LatheGeometry(points, 32);
  const pawnMesh = new THREE.Mesh(pawnGeom, blackMaterial);
  pawnMesh.position.y = -2;

  s.add(pawnMesh);

  return s;
}

const scene = buildPawn();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
