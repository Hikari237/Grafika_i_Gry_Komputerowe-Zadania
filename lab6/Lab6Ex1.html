<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>CS 424 Lab 9 - Karuzela</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info">
        <h2>Three.js: Karuzela</h2>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const horseObjects = [];
        const clock = new THREE.Clock();

        const carouselGroup = new THREE.Group();
        scene.add(carouselGroup);

        const N = 13;
        const purpleMat = new THREE.MeshPhongMaterial({ color: 0x8A2BE2 });
        const goldMat = new THREE.MeshPhongMaterial({ color: 0xB8860B });

        const baseGeom = new THREE.CylinderGeometry(11, 11, 0.5, N);
        const base = new THREE.Mesh(baseGeom, purpleMat);
        base.position.y = 0.25;
        carouselGroup.add(base);

        const topGeom = new THREE.CylinderGeometry(11, 11, 0.5, N);
        const canopy = new THREE.Mesh(topGeom, purpleMat);
        canopy.position.y = 7;
        carouselGroup.add(canopy);

        const textureLoader = new THREE.TextureLoader();
        const earthTex = textureLoader.load('resources/earth.jpg');
        const earthSphere = new THREE.Mesh(
            new THREE.SphereGeometry(3.5, 32, 32), 
            new THREE.MeshPhongMaterial({ map: earthTex })
        );
        earthSphere.position.y = 3.5;
        carouselGroup.add(earthSphere);

        for (let i = 0; i < N; i++) {
            const angle = (i * 2 * Math.PI) / N;
            const radius = 9.5; 
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 8), goldMat);
            pole.position.set(x, 3.5, z);
            carouselGroup.add(pole);
        }

        fetch('resources/horse.js')
            .then(response => response.text())
            .then(text => {
                const jsonStart = text.indexOf('{');
                const data = JSON.parse(text.substring(jsonStart));
                
                const geom = new THREE.BufferGeometry();
                const positions = [];
                const v = data.vertices;
                const f = data.faces;
                
                let i = 0;
                while (i < f.length) {
                    const type = f[i++];
                    const isQuad = (type & 1) === 1;
                    const hasMaterial = (type & 2) === 2;
                    const hasFaceUv = (type & 4) === 4;
                    const hasFaceVertexUv = (type & 8) === 8;
                    const hasFaceNormal = (type & 16) === 16;
                    const hasFaceVertexNormal = (type & 32) === 32;
                    const hasFaceColor = (type & 64) === 64;
                    const hasFaceVertexColor = (type & 128) === 128;

                    const a = f[i++];
                    const b = f[i++];
                    const c = f[i++];
                    const d = isQuad ? f[i++] : 0;

                    positions.push(v[a*3], v[a*3+1], v[a*3+2]);
                    positions.push(v[b*3], v[b*3+1], v[b*3+2]);
                    positions.push(v[c*3], v[c*3+1], v[c*3+2]);

                    if (isQuad) {
                        positions.push(v[a*3], v[a*3+1], v[a*3+2]);
                        positions.push(v[c*3], v[c*3+1], v[c*3+2]);
                        positions.push(v[d*3], v[d*3+1], v[d*3+2]);
                    }

                    if (hasMaterial) i++;
                    if (hasFaceUv) i++;
                    if (hasFaceVertexUv) {
                        const uvsLayers = data.uvs ? data.uvs.length : 1;
                        i += uvsLayers * (isQuad ? 4 : 3);
                    }
                    if (hasFaceNormal) i++;
                    if (hasFaceVertexNormal) i += (isQuad ? 4 : 3);
                    if (hasFaceColor) i++;
                    if (hasFaceVertexColor) i += (isQuad ? 4 : 3);
                }

                geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geom.computeVertexNormals();

                const horseColors = [0x2DE396, 0x00F7FF, 0xFF00C8, 0xFFD900];

                for (let j = 0; j < N; j++) {
                    const angle = (j * 2 * Math.PI) / N;
                    const radius = 9.5; 
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;

                    const horseMat = new THREE.MeshPhongMaterial({ color: horseColors[j % 4] });
                    const horse = new THREE.Mesh(geom, horseMat);
                    
                    const scale = 0.001; 
                    horse.scale.set(scale, scale, scale);
                    
                    horse.position.set(x, 3.5, z);
                    horse.rotation.y = -angle;
                    carouselGroup.add(horse);
                    
                    horseObjects.push({ model: horse, offset: j });
                }
            });

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            carouselGroup.rotation.y = -time * 0.5;
            earthSphere.rotation.y = time * 0.8;

            for (let i = 0; i < horseObjects.length; i++) {
                const horse = horseObjects[i];
                horse.model.position.y = 3.5 + Math.sin(time * 4 + horse.offset) * 1.0;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
